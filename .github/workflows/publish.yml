name: Build & Release

on:
  push:
    branches: ['main']

  workflow_dispatch:

concurrency:
  group: 'publish'
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - run: npm ci

      - run: npm run build

      - name: Zip extension
        run: |
          mkdir -p release/indelible-browser-extension
          cp -r dist release/indelible-browser-extension/dist
          cp -r icons release/indelible-browser-extension/icons
          cp manifest.json popup.html release/indelible-browser-extension/
          cd release/indelible-browser-extension
          zip -r ../../indelible-browser-extension-latest.zip .

      - name: Move latest tag
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          files: indelible-browser-extension-latest.zip
          generate_release_notes: false
          make_latest: true
