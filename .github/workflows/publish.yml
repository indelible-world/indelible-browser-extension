name: Build & Release

on:
  push:
    branches: ['main']

  workflow_dispatch:

concurrency:
  group: 'publish'
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - run: npm ci

      - run: npm run build

      - name: Zip extension
        run: |
          for target in chrome firefox; do
            out="release/$target"
            mkdir -p "$out"
            cp -r dist "$out/dist"
            cp -r icons "$out/icons"
            cp popup.html "$out/"
            if [ "$target" = firefox ]; then
              cp manifest.firefox.json "$out/manifest.json"
            else
              cp manifest.json "$out/manifest.json"
            fi
            (cd "$out" && zip -r "../../indelible-browser-extension-$target-latest.zip" .)
          done

      - name: Move latest tag
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          files: |
            indelible-browser-extension-chrome-latest.zip
            indelible-browser-extension-firefox-latest.zip
          generate_release_notes: false
          make_latest: true
